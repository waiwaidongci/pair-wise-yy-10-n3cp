<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>漆线雕工坊 · 定级审签与证书发放台</title>
  <style>
    :root {
      --bg: #eef3f0;
      --panel: #ffffff;
      --ink: #1e2624;
      --muted: #62706b;
      --line: #ccd8d2;
      --teal: #1f6b68;
      --red: #a43f42;
      --amber: #aa7a24;
      --violet: #665c93;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    header { padding: 22px 28px 16px; border-bottom: 1px solid var(--line); background: #fbfdfb; display: flex; justify-content: space-between; gap: 18px; align-items: end; }
    h1 { margin: 0; font-size: 26px; letter-spacing: 0; }
    .sub, .meta { color: var(--muted); font-size: 13px; line-height: 1.5; }
    main { padding: 20px 28px 34px; display: grid; gap: 18px; }
    button, input, select, textarea { font: inherit; border-radius: 6px; }
    input, select, textarea { width: 100%; border: 1px solid var(--line); padding: 9px 10px; background: #fff; color: var(--ink); }
    textarea { min-height: 68px; resize: vertical; }
    button { border: 0; background: var(--teal); color: #fff; padding: 9px 11px; cursor: pointer; min-height: 38px; }
    button.secondary { background: #5d6764; }
    button.warn { background: var(--amber); }
    button.danger { background: var(--red); }
    button.violet { background: var(--violet); }
    button.sm { min-height: 30px; padding: 5px 10px; margin-top: 6px; font-size: 12px; }
    label { display: grid; gap: 5px; font-size: 12px; color: var(--muted); }
    .top { display: grid; grid-template-columns: 360px 1fr; gap: 18px; align-items: start; }
    .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px; }
    .panel h2 { margin: 0 0 12px; font-size: 17px; }
    form { display: grid; gap: 10px; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .toolbar { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 12px; }
    .lists { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 16px; }
    .mini { border: 1px solid var(--line); border-radius: 8px; padding: 10px; background: #fbfdfb; min-height: 118px; }
    .mini h3 { margin: 0 0 8px; font-size: 14px; }
    .item { border: 1px solid #d7e0dc; border-left: 4px solid var(--teal); background: #fff; border-radius: 7px; padding: 9px; margin-bottom: 8px; cursor: pointer; }
    .item.overdue { border-left-color: var(--red); }
    .board { display: grid; grid-template-columns: repeat(4, minmax(185px, 1fr)); gap: 12px; overflow-x: auto; }
    .col { background: #f9fbf9; border: 1px solid var(--line); border-radius: 8px; padding: 10px; min-height: 320px; }
    .col h3 { display: flex; justify-content: space-between; margin: 0 0 10px; font-size: 15px; }
    .actions { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 8px; }
    .actions button { flex: 1; min-width: 82px; font-size: 12px; padding: 7px 8px; }
    dialog { border: 1px solid var(--line); border-radius: 8px; width: min(640px, calc(100vw - 24px)); padding: 0; }
    dialog::backdrop { background: rgba(0, 0, 0, 0.3); }
    .dialog-body { padding: 16px; display: grid; gap: 10px; }
    .empty { color: var(--muted); font-size: 13px; padding: 8px 0; }

    /* 定级审签区 */
    .desk { display: grid; grid-template-columns: 1.15fr 1fr; gap: 18px; align-items: start; }
    #certQueue, #certLedger { display: grid; gap: 10px; }
    .queue-card { border: 1px solid var(--line); border-left: 4px solid var(--violet); border-radius: 8px; padding: 11px; background: #fcfbff; display: grid; gap: 8px; }
    .queue-card.rejudge { border-left-color: var(--amber); background: #fffdf5; }
    .qhead { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .qtime { margin-left: auto; }
    .tag { font-size: 11px; border: 1px solid var(--violet); color: var(--violet); border-radius: 20px; padding: 1px 9px; }
    .rejudge-tag { border-color: var(--amber); color: var(--amber); }
    .qform { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; align-items: end; }
    .qactions { grid-column: 1 / -1; }
    .qerror { font-size: 12px; color: var(--red); background: #fbeeef; border-radius: 6px; padding: 6px 8px; }

    .cert { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; background: #fbfdfb; }
    .cert.voided { background: #f6f7f6; opacity: 0.85; }
    .cert-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
    .certstate { font-size: 12px; border-radius: 20px; padding: 1px 10px; }
    .certstate.ok { color: var(--teal); border: 1px solid var(--teal); }
    .certstate.dead { color: var(--muted); border: 1px solid var(--line); }
    .voidnote { color: var(--red); font-size: 12px; }

    .badges { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0; }
    .badge { font-size: 11px; border-radius: 20px; padding: 2px 10px; border: 1px solid; }
    .badge.cert { color: var(--teal); border-color: var(--teal); background: #f0f7f5; }
    .badge.grading { color: var(--violet); border-color: var(--violet); background: #f4f2fa; }
    .badge.void { color: var(--muted); border-color: var(--line); background: #f4f6f5; }
    .badge.ready { color: var(--amber); border-color: var(--amber); background: #fdf8ec; }
    .certline { font-size: 13px; border-radius: 6px; padding: 7px 9px; background: #f4f6f5; }
    .okline { background: #eef6f3; border: 1px solid #bcd8d0; }
    .deadline { background: #f6f4f0; border: 1px solid #e0d6c4; color: var(--muted); }
    #warnVoid { font-size: 12px; color: var(--red); background: #fbeeef; border-radius: 6px; padding: 7px 9px; }
    .logline { font-size: 12px; color: var(--muted); border-bottom: 1px dashed #dde5e1; padding: 4px 0; }
    #history { border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px; max-height: 180px; overflow-y: auto; background: #fcfdfc; }
    #history h3 { margin: 0 0 6px; font-size: 13px; }

    #toast { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 16px); background: #22302c; color: #fff; padding: 10px 18px; border-radius: 8px; font-size: 13px; opacity: 0; pointer-events: none; transition: all .2s ease; max-width: calc(100vw - 32px); }
    #toast.show { opacity: 1; transform: translate(-50%, 0); }
    #toast.error { background: var(--red); }

    @media (max-width: 980px) {
      header { display: block; padding: 18px; }
      main { padding: 16px; }
      .top, .lists, .toolbar, .desk { grid-template-columns: 1fr; }
      .grid2, .qform { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>漆线雕工坊 · 定级审签与证书发放台</h1>
      <div class="sub">贴线、阴干、上金粉、待交付流转；满工无缺陷方可申请定级，审签后发放唯一编号证书</div>
    </div>
    <button id="exportBtn" class="secondary">导出 JSON</button>
  </header>

  <main>
    <section class="top">
      <form id="workForm" class="panel">
        <h2>新增作品</h2>
        <div class="grid2">
          <label>胎体材质<input name="base" required placeholder="脱胎漆器"></label>
          <label>纹样主题<input name="theme" required placeholder="缠枝莲"></label>
        </div>
        <div class="grid2">
          <label>线条粗细<select name="line"><option>细线</option><option>中线</option><option>粗线</option><option>混合线</option></select></label>
          <label>贴线进度<input name="progress" type="number" min="0" max="100" value="25"></label>
        </div>
        <div class="grid2">
          <label>阴干日期<input name="dryDate" type="date" required></label>
          <label>交付日期<input name="delivery" type="date" required></label>
        </div>
        <div class="grid2">
          <label>金粉处理状态<select name="gold"><option>未处理</option><option>试扫粉</option><option>已上金粉</option></select></label>
          <label>当前状态<select name="status"><option>贴线中</option><option>待阴干</option><option>上金粉</option><option>待交付</option></select></label>
        </div>
        <label>缺陷位置<input name="defect" placeholder="右下花瓣断线"></label>
        <label>备注<textarea name="note" placeholder="客户偏好、修补记录"></textarea></label>
        <button type="submit">加入工坊</button>
      </form>

      <section class="panel">
        <h2>今日与风险</h2>
        <div class="lists">
          <div class="mini">
            <h3>今日待阴干</h3>
            <div id="todayDry"></div>
          </div>
          <div class="mini">
            <h3>缺陷作品</h3>
            <div id="defectList"></div>
          </div>
          <div class="mini">
            <h3>最近交付</h3>
            <div id="deliveryList"></div>
          </div>
        </div>
        <div class="toolbar">
          <label>主题筛选<input id="themeFilter" placeholder="输入纹样"></label>
          <label>状态筛选<select id="statusFilter"></select></label>
          <label>交付排序<select id="sortMode"><option value="delivery">按交付日期</option><option value="dry">按阴干日期</option></select></label>
          <button id="clearFilters" class="secondary">清空</button>
        </div>
        <div id="board" class="board"></div>
      </section>
    </section>

    <section class="desk">
      <section class="panel">
        <h2>定级审签 · 证书队列（未结束定级）</h2>
        <div class="sub" style="margin-bottom:10px">仅满工且无缺陷的作品可申请；等级、检验人、签发人齐备方可签发，检验与签发同人则整单拒绝。</div>
        <div id="certQueue"></div>
      </section>
      <section class="panel">
        <h2>证书台账（唯一编号 · 全量留痕）</h2>
        <div class="sub" style="margin-bottom:10px">改动胎体、纹样、线条或缺陷后旧证失效只读，并按新值重判、另行发证。</div>
        <div id="certLedger"></div>
      </section>
    </section>
  </main>

  <datalist id="staffList">
    <option value="林砚秋"></option>
    <option value="周广业"></option>
    <option value="陈守拙"></option>
    <option value="黄素绫"></option>
  </datalist>

  <dialog id="detailDialog">
    <div class="dialog-body">
      <h2 id="detailTitle">作品详情</h2>
      <div id="detailContent" class="meta"></div>
      <div class="grid2">
        <label>胎体材质<input id="baseInput"></label>
        <label>纹样主题<input id="themeInput"></label>
      </div>
      <div class="grid2">
        <label>线条粗细<select id="lineInput"><option>细线</option><option>中线</option><option>粗线</option><option>混合线</option></select></label>
        <label>贴线进度<input id="progressInput" type="number" min="0" max="100"></label>
      </div>
      <div class="grid2">
        <label>金粉状态<select id="goldInput"><option>未处理</option><option>试扫粉</option><option>已上金粉</option></select></label>
        <label>缺陷位置<input id="defectEditInput" placeholder="无缺陷请留空"></label>
      </div>
      <div id="warnVoid">该作品存在有效证书或进行中的定级：保存对胎体/纹样/线条/缺陷的改动将使旧证失效，并按新值自动重判。</div>
      <div id="history">
        <h3>作品履历</h3>
        <div id="historyLog"></div>
      </div>
      <div class="actions">
        <button id="saveDetail" class="warn">保存改动（触发重判）</button>
        <button id="closeDialog" class="secondary">关闭</button>
      </div>
    </div>
  </dialog>

  <div id="toast"></div>

  <script src="store.js"></script>
  <script src="grading.js"></script>
  <script src="app.js"></script>
</body>
</html>
